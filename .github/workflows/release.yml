name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect the package without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run doctor
      - run: npm pack --dry-run
      - if: ${{ inputs.dry_run == false }}
        run: npm publish --provenance --access public
