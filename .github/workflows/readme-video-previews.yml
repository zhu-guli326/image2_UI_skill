name: Build README video previews

on:
  push:
    branches:
      - agent/readme-capabilities-real-output
    paths:
      - .github/workflows/readme-video-previews.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/readme-capabilities-real-output

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build looping GIF previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/readme/video-previews
          for src in assets/video-cases/*.mp4; do
            name="$(basename "$src" .mp4)"
            ffmpeg -y -i "$src" -t 5 -vf "fps=10,scale=420:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" "assets/readme/video-previews/${name}.gif"
          done

      - name: Commit generated previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/video-previews/*.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: generate inline README video previews [skip ci]"
          git push origin HEAD:agent/readme-capabilities-real-output
