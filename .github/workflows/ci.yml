name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright browser runtime
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Validate bundled static demo
        run: npm run validate:demo

      - name: Validate every demo
        run: npm run validate:all

      - name: Audit demo dependencies
        run: npm run audit:demo

      - name: Check image2 channel diagnostics
        run: npm run doctor

      - name: Check npm package contents
        run: npm run pack:check
