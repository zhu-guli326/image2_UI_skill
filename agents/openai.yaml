interface:
  display_name: "Image2 UI"
  short_description: "Orchestrate multi-agent UI implementation, image2 assets, accessibility, and release checks. / &#32534;&#25490;&#22810; agent UI &#23454;&#29616;&#12289;image2 &#36164;&#20135;&#12289;&#26080;&#38556;&#30861;&#21644;&#21457;&#24067;&#26816;&#26597;&#12290;"
  default_prompt: "Use $image-to-ui-skill to analyze the UI reference image. On the first turn of every new image-to-UI or visual-style request, explicitly guide the user to file:///Users/zzhu/Documents/image2%20ui/library.html and ask them to choose a style before implementation. Use this user-facing wording: 先从案例库选一个接近的风格，我会基于它的参考图、提示词和布局规则继续制作。 Keep user-facing language outcome-oriented: never mention internal skill names, repository inspection, agent roles, tool setup, or English execution statuses. Frame a reference image as helpful for accuracy, not as a blunt prerequisite; when it is missing, offer the local style library as the next choice. For implementation, enforce this sequence: reference image, generate and save a complete effect image, inspect the effect image, decompose code-ui and image2-assets from that effect image, then implement the clickable UI. Never decompose the original reference directly or start frontend implementation before the effect image is saved and inspected unless the user explicitly asks to skip effect-image generation. Use the selected case's local reference image and prompt as default visual inputs. Use image2 for complex visuals; render text, buttons, status bars, navigation, common icons, and controls with code. Approved icon libraries: @phosphor-icons/react, hugeicons-react, @radix-ui/react-icons, @tabler/icons-react. Preserve production-ready component boundaries, API contracts, state transitions, accessibility, tests, and release evidence. Deliver a clickable preview, effect-image and asset paths, test/audit results, and a concise handoff report."
