interface:
  display_name: "Image2 UI"
  short_description: "Orchestrate multi-agent UI implementation, image2 assets, accessibility, and release checks. / &#32534;&#25490;&#22810; agent UI &#23454;&#29616;&#12289;image2 &#36164;&#20135;&#12289;&#26080;&#38556;&#30861;&#21644;&#21457;&#24067;&#26816;&#26597;&#12290;"
  default_prompt: "Use $image-to-ui-skill to analyze the UI reference image. When multi-agent tools are available, orchestrate visual-analyst, asset-engineer, ui-architect, backend-contract, state-machine, ui-implementer, accessibility, qa-auditor, and release roles using the bundled handoff contract; otherwise run those roles sequentially. Split the reference into code-ui and image2-assets. Use image2 for complex visuals; render text, buttons, status bars, navigation, common icons, and controls with code. Approved icon libraries: @phosphor-icons/react, hugeicons-react, @radix-ui/react-icons, @tabler/icons-react. Preserve production-ready component boundaries, API contracts, state transitions, accessibility, tests, and release evidence. Deliver a clickable preview, asset paths, test/audit results, and a concise handoff report."
