topic: "Image2 UI 案例库参考调研"

field_categories:
  identity:
    detail_level: "brief"
    fields:
      - name: "title"
        description: "案例名称"
      - name: "source_url"
        description: "原始来源链接"
      - name: "source_capture_date"
        description: "参考页面或截图采集日期"
      - name: "content_type"
        description: "真实产品、概念稿、课程项目、重设计、工作室案例或技术实验"
      - name: "evidence_level"
        description: "作者说明、可运行页面、视频证据或截图推断"

  discovery:
    detail_level: "detailed"
    fields:
      - name: "product_domain"
        description: "SaaS、电商、金融、内容、工具、教育等业务领域"
      - name: "page_or_flow_type"
        description: "landing、dashboard、editor、upload、onboarding、checkout、search、result 等"
      - name: "reference_object"
        description: "完整页面、区块、组件、用户流程、动效或视觉语言"
      - name: "device_and_viewport"
        description: "设备、操作系统、浏览器、截图宽高和响应式断点"
      - name: "interaction_trigger"
        description: "hover、click、tap、drag、scroll、keyboard、voice 或 device motion"
      - name: "ui_states_covered"
        description: "正常、加载、空、错误、成功、禁用等状态覆盖"

  visual_system:
    detail_level: "detailed"
    fields:
      - name: "design_tokens"
        description: "颜色、字体、间距、圆角、阴影和层级"
      - name: "reusable_components"
        description: "可复用组件、变体数量和所属页面"
      - name: "asset_provenance_and_license"
        description: "原站素材、自制、生成、授权素材与字体许可"
      - name: "media_spec"
        description: "图片、GIF、视频或 3D 的格式、尺寸、时长、帧率、体积和加载策略"
      - name: "mobile_adaptation_strategy"
        description: "缩放、重排、裁切、替换、隐藏或交互改写"

  comparison:
    detail_level: "detailed"
    fields:
      - name: "comparison_method"
        description: "并排、叠层、滑块、闪烁、差异热图或视频同步"
      - name: "fidelity_score"
        description: "布局、字体、颜色、素材、响应式和交互的分项评分"
      - name: "design_intent_vs_inference"
        description: "区分作者公开说明、可观察事实和复刻者推断"
      - name: "issue_decision_outcome"
        description: "问题、判断、实现和结果的结构化记录"
      - name: "related_cases_and_benchmarks"
        description: "相似页面、组件或流程的横向比较"

  implementation:
    detail_level: "detailed"
    fields:
      - name: "implementation_stack"
        description: "框架、样式、动画库、3D/Canvas、CMS 和媒体服务"
      - name: "motion_controls"
        description: "时长、缓动、触发范围、循环、暂停和 reduced-motion 替代"
      - name: "technical_cost_breakdown"
        description: "设计、素材、前端、3D、动效和内容维护成本"
      - name: "performance_budget"
        description: "LCP、资源体积、动画帧率、低端设备表现和降级方式"
      - name: "accessibility_status"
        description: "键盘、对比度、语义、触控、字幕和 reduced-motion 验证"

  lifecycle:
    detail_level: "moderate"
    fields:
      - name: "live_demo_status"
        description: "可运行、部分可运行、仅录屏、链接失效或已归档"
      - name: "version_and_changelog"
        description: "参考版本、实现版本、依赖版本和主要更新"
      - name: "production_readiness"
        description: "视觉实验、原型、可交付实现或生产级"
      - name: "risk_detail"
        description: "性能、可访问性、版权、移动端、SEO 和维护风险"

uncertain:
  - "第三方案例是否为真实上线产品"
  - "未公开的设计决策和业务指标"
  - "第三方演示当前是否仍可运行"
  - "素材和字体的完整转载授权范围"
  - "未公开的性能数据与设备兼容性"
