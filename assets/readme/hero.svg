      <text x="142" y="0" fill="#64748B">/</text>
      <text x="158" y="0" fill="#AEB8C4">validate</text>
      <text x="232" y="0" fill="#64748B">/</text>
      <text x="248" y="0" fill="#AEB8C4">compare</text>
