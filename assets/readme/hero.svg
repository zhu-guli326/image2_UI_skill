      <text x="20" y="45" fill="#F8FAFC" font-size="16" font-weight="650">截图 / 设计稿 / App 图</text>

      <path d="M190 29H236" stroke="#94F4D0" stroke-width="3" stroke-linecap="round"/>
      <path d="M229 20L239 29L229 38" fill="none" stroke="#94F4D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

