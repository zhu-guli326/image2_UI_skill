<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FitHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10h-6v-6H9v6H3Z" />
      </symbol>
      <symbol id="calendar" viewBox="0 0 24 24">
        <rect x="4" y="5" width="16" height="15" rx="2" />
        <path d="M8 3v4m8-4v4M4 10h16" />
      </symbol>
      <symbol id="chart" viewBox="0 0 24 24">
        <path d="M5 19V9m7 10V5m7 14v-6" />
      </symbol>
      <symbol id="settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19 13.2v-2.4l-2-.7a6 6 0 0 0-.5-1.2l.9-2-1.7-1.7-2 .9a6 6 0 0 0-1.2-.5l-.7-2H9.4l-.7 2a6 6 0 0 0-1.2.5l-2-.9L3.8 6.9l.9 2a6 6 0 0 0-.5 1.2l-2 .7v2.4l2 .7a6 6 0 0 0 .5 1.2l-.9 2 1.7 1.7 2-.9a6 6 0 0 0 1.2.5l.7 2h2.4l.7-2a6 6 0 0 0 1.2-.5l2 .9 1.7-1.7-.9-2a6 6 0 0 0 .5-1.2Z"
        />
      </symbol>
      <symbol id="user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4.5 21c.6-4 3.1-6 7.5-6s6.9 2 7.5 6" />
      </symbol>
      <symbol id="play" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z" /></symbol>
      <symbol id="arrow" viewBox="0 0 24 24">
        <path d="M4 12h16m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="signal" viewBox="0 0 24 24">
        <path d="M5 19v-3m4.5 3v-6m4.5 6V9m4.5 10V5" />
      </symbol>
      <symbol id="wifi" viewBox="0 0 24 24">
        <path
          d="M4 9a12 12 0 0 1 16 0m-13 3a7.5 7.5 0 0 1 10 0m-7 3a3 3 0 0 1 4 0m-2 4h.01"
        />
      </symbol>
      <symbol id="battery" viewBox="0 0 24 24">
        <rect x="3" y="7" width="16" height="10" rx="2" />
        <path d="M21 10v4M6 10h8" />
      </symbol>
    </svg>
    <main class="stage">
      <p class="stage-label">FITHUB / MOVE BETTER</p>
      <p class="stage-note">
        Training, activity and focus.<br />One compact daily flow.
      </p>
      <section class="phone">
        <div class="screen">
          <div class="island"></div>
          <header class="status">
            <time>9:41</time
            ><span
              ><svg><use href="#signal" /></svg><svg><use href="#wifi" /></svg
              ><svg><use href="#battery" /></svg
            ></span>
          </header>
          <section class="view discover active" data-view="discover">
            <header class="top">
              <div>
                <p>Hello, Aiden</p>
                <h1>Welcome to FitHub</h1>
              </div>
              <button
                class="circle"
                data-feedback="Profile settings opened."
                aria-label="Profile"
              >
                <svg><use href="#user" /></svg>
              </button>
            </header>
            <div class="filters" role="tablist" aria-label="Workout categories">
              <button class="selected" role="tab" aria-selected="true">All</button
              ><button role="tab" aria-selected="false">Strength</button
              ><button role="tab" aria-selected="false">Mobility</button
              ><button role="tab" aria-selected="false">Cardio</button>
            </div>
            <div class="discover-row">
              <div>
                <p class="mini">Recommended</p>
                <h2>Strength<br />starter</h2>
                <button class="text-action" data-set="activity">
                  View plan <svg><use href="#arrow" /></svg>
                </button>
              </div>
              <button
                class="coach-card"
                data-feedback="Full body fundamentals selected."
                aria-label="Open full body fundamentals"
              >
                <img
                  class="visual-photo"
                  src="assets/workout-coach.png"
                  alt="Coach training with a dumbbell"
                /><span
                  ><svg><use href="#play" /></svg
                ></span>
              </button>
            </div>
            <button class="progress-card" data-set="focus">
              <img class="visual-photo" src="assets/target-athlete.png" alt="" />
              <div>
                <p>Weekly goal</p>
                <b>75%</b><span>Complete</span><small>3 sessions left</small>
              </div>
            </button>
            <button class="list-card" data-set="focus">
              <img class="visual-photo" src="assets/target-athlete.png" alt="" />
              <div><b>Upper body</b><span>Next · 5 reps</span></div>
              <svg><use href="#arrow" /></svg>
            </button>
          </section>
          <section class="view activity" data-view="activity" hidden>
            <header class="top activity-head">
              <div>
                <p>Your activities</p>
                <h1>Tuesday, 24 April</h1>
              </div>
              <button
                class="circle"
                data-feedback="Profile settings opened."
                aria-label="Profile"
              >
                <svg><use href="#user" /></svg>
              </button>
            </header>
            <div class="dates">
              <button>21</button><button>22</button><button>23</button
              ><button class="selected">24</button><button>25</button
              ><button>26</button>
            </div>
            <div class="metric-grid">
              <button
                class="metric purple"
                data-feedback="Today's steps: 1,320."
              >
                <p>Steps</p>
                <b>1,320</b><span>Steps</span></button
              ><button
                class="metric blue"
                data-feedback="Water target: 3.1 liters."
              >
                <p>Water</p>
                <b>3.1</b><span>Liters</span>
              </button>
            </div>
            <div class="stat">
              <b>2,940</b><span>kcal</span>
              <p>Today’s statistic</p>
            </div>
            <div class="bars" aria-label="Weekly energy chart">
              <i></i><i></i><i class="tall"></i><i></i><i class="high"></i
              ><i></i>
            </div>
          </section>
          <section class="view focus" data-view="focus" hidden>
            <header class="focus-top">
              <button class="circle" data-set="discover" aria-label="Back">
                <svg><use href="#arrow" /></svg>
              </button>
              <p>Focus builder</p>
            </header>
            <div class="athlete">
              <img
                src="assets/target-athlete.png"
                alt="Athletic woman in training wear"
              /><button class="tag face" data-zone="Face">Face</button
              ><button class="tag arms" data-zone="Arms">Arms</button
              ><button class="tag core" data-zone="Core">Core</button
              ><button class="tag legs" data-zone="Legs">Legs</button>
            </div>
            <h1>Which target areas<br />would you like to focus on?</h1>
            <button class="next" data-set="activity">
              Next question <svg><use href="#arrow" /></svg>
            </button>
          </section>
          <nav class="dock" aria-label="Main navigation">
            <button class="selected" data-set="discover" aria-label="Discover">
              <svg><use href="#home" /></svg><span>Home</span></button
            ><button data-set="activity" aria-label="Activity">
              <svg><use href="#calendar" /></svg><span>Activity</span></button
            ><button data-set="focus" aria-label="Focus">
              <svg><use href="#chart" /></svg><span>Focus</span></button
            ><button data-feedback="Settings opened." aria-label="Settings">
              <svg><use href="#settings" /></svg><span>Settings</span>
            </button>
          </nav>
          <output id="feedback" aria-live="polite"></output>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
